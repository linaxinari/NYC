<script>
    const models = [
        { id: 'cutecat', name: 'Cat' },
        { id: 'bunny1', name: 'Bunny' },
        { id: 'chestnuts', name: 'Chestnuts' }
    ];
    let currentModelIndex = 0;
    let isVisible = false;
    const modelEntity = document.getElementById('model');
    const counter = document.getElementById('counter');

    function loadModel(index) {
        modelEntity.removeAttribute('animation');
        modelEntity.setAttribute('gltf-model', `#${models[index].id}`);
        counter.textContent = `${index + 1}/${models.length}`;
    }

    function animateIn() {
        modelEntity.setAttribute('animation', {
            property: 'scale',
            from: '0 0 0',
            to: '2 2 2',
            dur: 800,
            easing: 'easeOutElastic'
        });
    }

    function animateOut(callback) {
        modelEntity.removeAttribute('animation');
        modelEntity.setAttribute('scale', '0 0 0');
        setTimeout(callback, 50);
    }

    document.getElementById('surprise-btn').addEventListener('click', () => {
        if (!isVisible) return;
        animateOut(() => {
            currentModelIndex = (currentModelIndex + 1) % models.length;
            loadModel(currentModelIndex);
            animateIn();
        });
    });

    document.querySelector('#target').addEventListener('targetFound', () => {
        isVisible = true;
        animateIn();
    });

    document.querySelector('#target').addEventListener('targetLost', () => {
        isVisible = false;
        modelEntity.removeAttribute('animation');
        modelEntity.setAttribute('scale', '0 0 0');
    });

    loadModel(0);
</script>
