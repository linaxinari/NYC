<!doctype html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=yes, minimum-scale=1.0, maximum-scale=2.0">
    <title>NYC AR</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
</head>
<body style='margin: 0px; overflow: hidden;'>
    <div id="debug" style="position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: #0f0; padding: 10px; font-family: monospace; font-size: 12px; z-index: 1000; max-width: 300px;">
        <div>Initializing...</div>
    </div>

    <a-scene
        embedded
        arjs='sourceType: webcam; debugUIEnabled: false;'
        vr-mode-ui="enabled: false"
        renderer="antialias: true; colorManagement: true;"
        id="scene">
        
        <a-assets>
            <a-asset-item id="cat" src="https://raw.githubusercontent.com/linaxinari/NYC/main/sitting_cat2.glb"></a-asset-item>
        </a-assets>

        <!-- QR Code Marker -->
        <a-marker
            type='qr'
            url='https://raw.githubusercontent.com/linaxinari/NYC/main/sitting_cat2.glb'
            id="qr-marker">
            <a-entity
                id="cat-model"
                gltf-model="#cat"
                position="0 0 0"
                scale="0.5 0.5 0.5"
                rotation="0 0 0">
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const debugDiv = document.getElementById('debug');
        const scene = document.getElementById('scene');
        
        function log(msg) {
            console.log(msg);
            debugDiv.innerHTML += '<div>' + msg + '</div>';
        }

        log('✓ Page loaded');
        log('✓ Waiting for QR code...');
        log('Point camera at QR code');

        scene.addEventListener('qrFound', function() {
            log('✓ QR Code detected!');
        });

        scene.addEventListener('markerFound', function(event) {
            log('✓ Marker found');
        });

        scene.addEventListener('markerLost', function(event) {
            log('⚠ Marker lost');
        });

        // Monitor model loading
        const model = document.getElementById('cat-model');
        if (model) {
            model.addEventListener('model-loaded', function() {
                log('✓ Model loaded');
            });
        }
    </script>
</body>
</html>
