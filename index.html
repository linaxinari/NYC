<!doctype html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=yes, minimum-scale=1.0, maximum-scale=2.0">
    <title>NYC AR</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
</head>
<body style='margin: 0px; overflow: hidden;'>
    <a-scene
        embedded
        arjs='sourceType: webcam; debugUIEnabled: false;'
        vr-mode-ui="enabled: false"
        renderer="antialias: true; colorManagement: true;">
        
        <a-assets>
            <a-asset-item id="cat" src="https://raw.githubusercontent.com/linaxinari/NYC/main/sitting_cat2.glb"></a-asset-item>
        </a-assets>

        <a-marker
            type='pattern'
            url='https://raw.githubusercontent.com/linaxinari/NYC/main/pattern-hert.patt'>
            <a-entity
                gltf-model="#cat"
                position="0 0 0"
                scale="1.5 1.5 1.5">
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
